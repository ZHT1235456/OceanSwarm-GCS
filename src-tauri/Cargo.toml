[package]
name = "ocean-swarm-gcs"
version = "2.1.0"
description = "OceanSwarm GCS - USV swarm ground control station"
authors = ["Zhu Huatian"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ocean_swarm_gcs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Smallest possible release binary: size-first optimisation, full LTO,
# single codegen unit and stripped symbols.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
incremental = false
